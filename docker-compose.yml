services:
  web:
    build: .
    ports:
      - "${PORT:-8000}:${PORT:-8000}"
    env_file: .env
    environment:
      - PORT=${PORT:-8000}
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_BROKER_BACKEND=redis
    volumes:
      # Base SQLite, index vectoriel et broker vivent dans data/ (settings.DATA_DIR) :
      # le web et les workers doivent monter le même volume.
      - score-data:/app/data
      - media-data:/app/media
    depends_on:
      - redis

  celery:
    build: .
    command: celery -A score worker -l info --pool=threads --concurrency=4
    env_file: .env
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_BROKER_BACKEND=redis
    volumes:
      - score-data:/app/data
      - media-data:/app/media
    depends_on:
      - redis

  celery-beat:
    build: .
    command: celery -A score beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    env_file: .env
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_BROKER_BACKEND=redis
    volumes:
      - score-data:/app/data
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

volumes:
  score-data:
  media-data:
  redis-data:
