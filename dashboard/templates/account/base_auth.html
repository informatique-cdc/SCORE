{% load static i18n %}
<!DOCTYPE html>
<html lang="{{ LANGUAGE_CODE|default:'fr' }}" data-theme="light" data-rail="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}SCORE{% endblock %}</title>

    <script>
    // Appliqué avant le premier rendu pour éviter le clignotement, comme dans
    // dashboard/base.html.
    (function(){
        var html = document.documentElement;
        try {
            var t = localStorage.getItem('ds-theme');
            // Pas de préférence stockée = « Système » : on suit le réglage de l'OS.
            if (t !== 'light' && t !== 'dark') {
                t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
            }
            html.setAttribute('data-theme', t);
            var r = localStorage.getItem('sc-rail');
            if (r === 'light' || r === 'dark') html.setAttribute('data-rail', r);
        } catch(e) {}
    })();
    </script>

    <link rel="stylesheet" href="{% static 'css/app.css' %}">
    {% block extra_css %}{% endblock %}
</head>
<body class="sc-auth">
    <main class="sc-auth-card">
        <div class="sc-wordmark sc-auth-brand">
            <span class="sc-wordmark-name">SCORE</span>
            <span class="sc-wordmark-tag">{% trans "audit" %}</span>
        </div>
        <p class="sc-auth-sub">{% block subtitle %}{% trans "Analyse documentaire d'entreprise" %}{% endblock %}</p>

        {% block content %}{% endblock %}
    </main>

    {% include "dashboard/includes/toasts.html" %}
</body>
</html>
