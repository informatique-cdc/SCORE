{% load i18n %}
<turbo-frame id="gaps-page-{{ page_obj.number }}">
{% for gap in gaps %}
{% include "analysis/_gap_card.html" %}
{% endfor %}

{% if can_edit %}
{% for gap in gaps %}
<form method="post" action="{% url 'gap-resolve' job.pk gap.pk %}" id="single-{{ gap.pk }}" hidden>
    {% csrf_token %}
    <input type="hidden" name="type_filter" value="{{ type_filter }}">
    <input type="hidden" name="resolution_filter" value="{{ resolution_filter }}">
</form>
{% endfor %}
{% endif %}

{% if next_page_url %}
<turbo-frame id="gaps-page-{{ page_obj.next_page_number }}" loading="lazy" src="{{ next_page_url }}">
    <div class="sc-loading" role="status" aria-label="{% trans "Chargement…" %}"><span></span><span></span><span></span></div>
</turbo-frame>
{% endif %}
</turbo-frame>
