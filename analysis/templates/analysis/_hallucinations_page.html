{% load i18n analysis_ui %}
<turbo-frame id="hallu-page-{{ page_obj.number }}">
{% for report in reports %}
{% include "analysis/_hallucination_card.html" %}

{# Formulaire individuel de cette fiche. #}
{% if can_edit %}
<form method="post" action="{% url 'hallucination-resolve' job.pk report.pk %}" id="single-{{ report.pk }}" hidden>
    {% csrf_token %}
    <input type="hidden" name="type_filter" value="{{ type_filter }}">
    <input type="hidden" name="resolution_filter" value="{{ resolution_filter }}">
</form>
{% endif %}
{% endfor %}

{% if next_page_url %}
<turbo-frame id="hallu-page-{{ page_obj.next_page_number }}" loading="lazy" src="{{ next_page_url }}">
    <div class="sc-loading" role="status" aria-label="{% trans "Chargement…" %}"><span></span><span></span><span></span></div>
</turbo-frame>
{% endif %}
</turbo-frame>
